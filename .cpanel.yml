---
# cPanel Git Version Control deployment.
# Set this repo's "Deployment" checkbox on in cPanel — every deploy runs
# these tasks from the repo's checkout directory (this project's root).
#
# Layout this produces under public_html/ (matches what the frontend code
# already expects by default, so no VITE_BACKEND_URL override is needed):
#
#   public_html/
#     index.html, assets/...     <- built frontend (dist/, committed as-is —
#                                    see note below on why it's not built here)
#     helpers.php, db.php        <- shared PHP includes (relative requires
#                                    from api/*.php expect these one level up)
#     config.php                 <- real DB credentials; NEVER touched by a
#                                    deploy once it exists (gitignored, so it
#                                    isn't part of the checkout at all)
#     api/                       <- backend/api/*.php endpoints
#     uploads/                   <- backend/uploads/* (KYC docs, deposit
#                                    proofs/QRs) — accumulates on the server,
#                                    independent of git
#
# backend/setup_db.php and backend/scripts/ are intentionally never
# published — they're one-time/maintenance tools, not safe to leave
# web-accessible.
#
# NOTE on the frontend: this deployment does NOT run `npm run build` on the
# server. Many shared-hosting Git deployment shells don't have npm/node on
# PATH (or it silently fails), which previously left the *raw, unbuilt*
# source (src/main.jsx etc.) sitting in public_html — a blank page, since
# browsers refuse to execute .jsx as a module script. Instead, `dist/` is
# built locally and committed to the repo — rebuild with `npm run build`
# and commit the result whenever src/ changes, before pushing.

deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html

    # --- Frontend -------------------------------------------------------
    # Remove the previous build's index.html and hashed assets/ first: `cp`
    # overwrites an existing file by opening+truncating it, which needs
    # write permission on that specific file — if a prior deploy (or a
    # manual File Manager edit) ever left index.html owned/permissioned
    # differently, `cp` silently fails on just that one file while still
    # succeeding on brand-new filenames elsewhere, leaving the live site
    # stuck on a stale index.html forever. Deleting first only needs write
    # permission on the directory, sidestepping that entirely, and also
    # stops old content-hashed JS/CSS files from accumulating forever.
    - /bin/rm -rf $DEPLOYPATH/assets
    - /bin/rm -f $DEPLOYPATH/index.html
    - /bin/cp -R dist/. $DEPLOYPATH/

    # --- Backend ----------------------------------------------------------
    - /bin/cp backend/helpers.php backend/db.php $DEPLOYPATH/
    - /bin/mkdir -p $DEPLOYPATH/api
    - /bin/cp -R backend/api/. $DEPLOYPATH/api/
    - /bin/mkdir -p $DEPLOYPATH/uploads
    - /bin/cp -R backend/uploads/. $DEPLOYPATH/uploads/

    # config.php holds real production DB credentials. It's gitignored, so
    # it's never part of this checkout — this only seeds it from the
    # template the very first time (when nothing's live yet) and otherwise
    # leaves whatever's already on the server completely alone.
    - "[ -f $DEPLOYPATH/config.php ] || /bin/cp backend/config.example.php $DEPLOYPATH/config.php"
